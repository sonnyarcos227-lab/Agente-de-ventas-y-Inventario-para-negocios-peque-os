<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deco · Decorer</title>
<style>
  :root { --fondo:#f6f1ea; --tarjeta:#fffdf9; --tinta:#2b2520; --suave:#7a6f66; --acento:#8a5a2b; --linea:#e6ddd2; --cliente:#ecdcc8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--fondo); color:var(--tinta); }
  .app { display:grid; grid-template-columns: 1fr 320px; gap:16px; max-width:1100px; margin:0 auto; padding:16px; height:100vh; }
  @media (max-width: 820px) { .app { grid-template-columns:1fr; height:auto; } }
  header { grid-column:1/-1; display:flex; align-items:baseline; gap:12px; }
  header h1 { margin:0; font-size:22px; letter-spacing:.5px; }
  header span { color:var(--suave); font-size:14px; }
  .chat { display:flex; flex-direction:column; background:var(--tarjeta); border:1px solid var(--linea); border-radius:14px; min-height:0; height:calc(100vh - 90px); }
  #mensajes { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:78%; padding:10px 14px; border-radius:14px; line-height:1.45; white-space:pre-wrap; }
  .deco { background:#f3ece3; align-self:flex-start; border-bottom-left-radius:4px; }
  .usted { background:var(--cliente); align-self:flex-end; border-bottom-right-radius:4px; }
  .meta { font-size:12px; color:var(--suave); margin-top:4px; }
  .chip { display:inline-block; font-size:11px; padding:2px 7px; border-radius:10px; background:#e9e1d6; margin:2px 3px 0 0; }
  .chip.mal { background:#f5d5cf; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--linea); }
  input[type=text] { flex:1; padding:12px 14px; border:1px solid var(--linea); border-radius:10px; font-size:15px; background:#fff; }
  button { padding:0 18px; border:0; border-radius:10px; background:var(--acento); color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; }
  #mic { width:52px; padding:0; font-size:22px; background:#efe6da; color:var(--tinta); }
  #mic.grabando { background:#b4382f; color:#fff; animation: latido 1s infinite; }
  @keyframes latido { 50% { box-shadow:0 0 0 8px rgba(180,56,47,.2); } }
  .galeria { display:flex; gap:8px; overflow-x:auto; margin-top:8px; padding-bottom:4px; }
  .galeria a { flex:0 0 150px; text-decoration:none; color:var(--tinta); background:#fff; border:1px solid var(--linea);
               border-radius:10px; overflow:hidden; font-size:12px; }
  .galeria img { width:150px; height:115px; object-fit:cover; display:block; background:#efe6da; }
  .galeria span { display:block; padding:5px 7px; line-height:1.3; }
  .galeria small { display:block; color:var(--suave); font-size:11px; margin-top:2px; }
  .oido { font-size:12px; color:var(--suave); font-style:italic; }
  aside { background:var(--tarjeta); border:1px solid var(--linea); border-radius:14px; padding:16px; overflow-y:auto; height:calc(100vh - 90px); }
  aside h2 { font-size:16px; margin:0 0 10px; }
  .item { display:flex; justify-content:space-between; gap:8px; font-size:14px; padding:6px 0; border-bottom:1px dashed var(--linea); }
  .total { font-weight:700; font-size:17px; display:flex; justify-content:space-between; margin-top:10px; }
  .vacio { color:var(--suave); font-size:14px; }
  .sug button { background:#efe6da; color:var(--tinta); font-size:13px; padding:7px 10px; margin:0 6px 6px 0; }
  .estado { font-size:12px; padding:2px 8px; border-radius:8px; background:#e9e1d6; }
  label { font-size:13px; color:var(--suave); display:flex; gap:6px; align-items:center; margin-top:14px; }
</style>
</head>
<body>
<div class="app">
  <header><h1><a href="/" style="color:inherit;text-decoration:none">Decorer</a> · Deco</h1><span>Asesora virtual de ventas · Mocoa</span></header>

  <section class="chat">
    <div id="mensajes">
      <div class="msg deco">¡Hola! Soy Deco, de Decorer. ¿Qué mueble o electrodoméstico está buscando?</div>
    </div>
    <form id="form">
      <input id="texto" type="text" placeholder="Escriba aquí, por ejemplo: ¿tienen colchones de 1.40?" autocomplete="off" autofocus>
      <button type="button" id="mic" title="Toque para hablar y toque otra vez para enviar">🎤</button>
      <button id="enviar">Enviar</button>
    </form>
  </section>

  <aside>
    <h2>Su pedido</h2>
    <div id="pedido"><p class="vacio">Todavía no hay productos.</p></div>
    <h2 style="margin-top:22px">Pruebe con</h2>
    <div class="sug">
      <button>¿Tienen colchones de 1.40?</button>
      <button>¿Lo puedo pagar por cuotas?</button>
      <button>¿Tienen sofacamas?</button>
      <button>¿Hacen domicilio?</button>
      <button>¿A qué hora abren?</button>
      <button>Muéstreme las salas en L</button>
    </div>
    <label><input type="checkbox" id="voz"> Deco responde hablando</label>
    <p class="vacio" style="margin:6px 0 0">Con 🎤 puede hablarle: toque para empezar y toque otra vez para enviar.</p>
    <label><input type="checkbox" id="detalle" checked> Ver herramientas y tiempos</label>
    <a href="/dueno" style="display:block;margin-top:14px;color:#8a5a2b;font-size:13px">Panel del dueño →</a>
    <button id="nueva" style="margin-top:14px;padding:9px 12px;background:#efe6da;color:#2b2520">Nueva conversación</button>
  </aside>
</div>

<script>
let conv = null;
const $ = id => document.getElementById(id);
try { conv = localStorage.getItem("deco_conv"); } catch (e) {}

function burbuja(texto, quien, meta) {
  const d = document.createElement("div");
  d.className = "msg " + quien;
  d.textContent = texto;
  if (meta) { const m = document.createElement("div"); m.className = "meta"; m.innerHTML = meta; d.appendChild(m); }
  $("mensajes").appendChild(d);
  $("mensajes").scrollTop = $("mensajes").scrollHeight;
  return d;
}

function galeria(burb, fotos) {
  if (!fotos || !fotos.length) return;
  const g = document.createElement("div"); g.className = "galeria";
  for (const f of fotos) {
    const a = document.createElement("a");
    a.href = `https://drive.google.com/file/d/${f.drive_id}/view`; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = `<img loading="lazy" alt=""><span></span>`;
    const img = a.querySelector("img");
    img.src = f.url; img.alt = f.titulo;
    img.onerror = () => a.remove();                       // si el Drive no la entrega, no deja un hueco
    a.querySelector("span").innerHTML = `${esc(f.titulo)}<small>Foto de referencia</small>`;
    g.appendChild(a);
  }
  const meta = burb.querySelector(".meta");
  burb.insertBefore(g, meta);
  $("mensajes").scrollTop = $("mensajes").scrollHeight;
}

function esc(t) { return String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function pintarPedido(p) {
  if (!p || !p.items || !p.items.length) { $("pedido").innerHTML = '<p class="vacio">Todavía no hay productos.</p>'; return; }
  let h = `<div style="margin-bottom:8px">${p.codigo} <span class="estado">${p.estado}</span></div>`;
  for (const i of p.items) h += `<div class="item"><span>${i.cantidad} × ${i.producto}</span><span>${i.subtotal_texto}</span></div>`;
  if (p.con_domicilio) h += `<div class="item"><span>Domicilio</span><span>${p.domicilio_texto}</span></div>`;
  h += `<div class="total"><span>Total</span><span>${p.total_texto}</span></div>`;
  if (p.estado === "separado") h += `<div class="item"><span>Abonado / saldo</span><span>${p.abonado} / ${p.saldo}</span></div>`;
  if (p.solicita_credito) h += `<p class="vacio">Crédito solicitado: ${p.solicita_credito}. Un asesor lo contacta.</p>`;
  $("pedido").innerHTML = h;
}

async function enviar(texto) {
  if (!texto.trim()) return;
  burbuja(texto, "usted");
  $("texto").value = ""; $("enviar").disabled = true;
  const espera = burbuja("Deco está escribiendo…", "deco");
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mensaje: texto, conversacion_id: conv, canal: $("voz").checked ? "voz" : "texto" }) });
    const d = await r.json();
    espera.remove();
    conv = d.conversacion_id; try { localStorage.setItem("deco_conv", conv); } catch (e) {}
    galeria(burbuja(d.respuesta, "deco", metaDe(d)), d.fotos);
    pintarPedido(d.pedido);
    if ($("voz").checked) fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto: d.respuesta }) }).then(r => r.json()).then(reproducir).catch(() => {});
  } catch (e) {
    espera.textContent = "No pude conectar con el servidor. ¿Está abierto run_backend.bat?";
  }
  $("enviar").disabled = false; $("texto").focus();
}

// ── Voz ───────────────────────────────────────────────
function reproducir(d) {
  if (d.audio_url) { new Audio(d.audio_url).play().catch(() => {}); return; }
  if ("speechSynthesis" in window && d.texto_hablado) {       // respaldo: la voz del navegador
    const u = new SpeechSynthesisUtterance(d.texto_hablado);
    u.lang = "es-CO"; speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
}

function metaDe(d) {
  if (!$("detalle").checked) return "";
  const t = d.tiempos || {};
  return d.herramientas.map(h => `<span class="chip ${h.ok ? "" : "mal"}">${h.nombre === "verificador" ? "✋ verificador corrigió" : h.nombre}</span>`).join("") +
    ` <span>${d.modelo || "sin modelo"} · ${(t.llamadas_llm || []).length} llamadas al LLM (${(t.llamadas_llm || []).map(l => (l.ms/1000).toFixed(1) + " s").join(" + ")})` +
    `${t.ms_stt ? " · oído " + (t.ms_stt/1000).toFixed(1) + " s" : ""}${t.ms_tts ? " · voz " + (t.ms_tts/1000).toFixed(1) + " s" : ""} · base ${t.ms_herramientas} ms</span>` +
    d.herramientas.filter(h => h.error).map(h => `<br><span style="color:#a33">✗ ${h.nombre}: ${h.error}</span>`).join("") +
    (d.error ? `<br><span style="color:#a33">${d.error.slice(0, 400)}</span>` : "") +
    (d.aviso_voz ? `<br><span>(voz del navegador: ${d.aviso_voz.slice(0, 120)})</span>` : "");
}

let grabadora = null, trozos = [];
$("mic").onclick = async () => {
  if (grabadora && grabadora.state === "recording") { grabadora.stop(); return; }
  let flujo;
  try { flujo = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { burbuja("No pude usar el micrófono. Revise el permiso del navegador (candado junto a la dirección).", "deco"); return; }
  trozos = [];
  grabadora = new MediaRecorder(flujo);
  grabadora.ondataavailable = ev => trozos.push(ev.data);
  grabadora.onstop = async () => {
    flujo.getTracks().forEach(t => t.stop());
    $("mic").classList.remove("grabando"); $("mic").textContent = "🎤";
    const blob = new Blob(trozos, { type: grabadora.mimeType || "audio/webm" });
    const yo = burbuja("🎙️ (escuchando su audio…)", "usted");
    const espera = burbuja("Deco está escuchando…", "deco");
    const fd = new FormData();
    fd.append("audio", blob, "voz." + ((grabadora.mimeType || "").includes("ogg") ? "ogg" : "webm"));
    if (conv) fd.append("conversacion_id", conv);
    $("mic").disabled = true;
    try {
      const r = await fetch("/api/voz", { method: "POST", body: fd });
      const d = await r.json();
      espera.remove();
      if (!r.ok) { yo.remove(); burbuja(d.detail || "No pude entender el audio.", "deco"); }
      else {
        yo.textContent = d.transcripcion;
        const o = document.createElement("div"); o.className = "oido"; o.textContent = "dicho por voz · " + d.motor_stt; yo.appendChild(o);
        conv = d.conversacion_id; try { localStorage.setItem("deco_conv", conv); } catch (e) {}
        galeria(burbuja(d.respuesta, "deco", metaDe(d)), d.fotos); pintarPedido(d.pedido); reproducir(d);
      }
    } catch (e) { espera.textContent = "No pude conectar con el servidor."; }
    $("mic").disabled = false;
  };
  grabadora.start();
  $("mic").classList.add("grabando"); $("mic").textContent = "■";
};

$("form").onsubmit = e => { e.preventDefault(); enviar($("texto").value); };
document.querySelectorAll(".sug button").forEach(b => b.onclick = () => enviar(b.textContent));
$("nueva").onclick = () => { conv = null; try { localStorage.removeItem("deco_conv"); } catch (e) {}
  $("mensajes").innerHTML = '<div class="msg deco">¡Hola! Soy Deco, de Decorer. ¿Qué mueble o electrodoméstico está buscando?</div>'; pintarPedido(null); };

if (conv) fetch(`/api/conversaciones/${conv}`).then(r => r.ok ? r.json() : null).then(d => {
  if (!d) { conv = null; return; }
  for (const m of d.mensajes) burbuja(m.contenido, m.rol === "usuario" ? "usted" : "deco");
  pintarPedido(d.pedido);
}).catch(() => {});
</script>
</body>
</html>
